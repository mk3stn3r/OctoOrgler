<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>OctoOrgler — Loading</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0a; overflow:hidden; }
  #loadScreen {
    height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#0a0a0a;
  }
  #loadScreen img {
    max-width:70%; max-height:60vh; image-rendering:pixelated; filter: drop-shadow(0 0 30px rgba(120,80,255,0.5));
    animation: flicker 2.2s infinite;
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    45% { opacity: 1; }
    46% { opacity: 0.75; }
    47% { opacity: 1; }
    72% { opacity: 1; }
    73% { opacity: 0.6; }
    74% { opacity: 1; }
  }
  #loadingText {
    margin-top: 24px;
    font-family: 'Courier New', monospace;
    color: #00ff41;
    font-size: 1.4em;
    letter-spacing: 3px;
    text-shadow: 0 0 8px #00ff41;
  }
  #loadingText::after {
    content: '';
    display: inline-block;
    width: 1ch;
    animation: dots 1.2s steps(4) infinite;
  }
  @keyframes dots {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
  }
  #progressBar {
    width: 320px; height: 18px; margin-top: 18px;
    border: 3px solid #00ff41; background: #041a04; border-radius: 2px; overflow: hidden;
  }
  #progressFill {
    height: 100%; width: 0%; background: repeating-linear-gradient(45deg, #00ff41, #00ff41 6px, #041a04 6px, #041a04 12px);
    transition: width 3.2s linear;
  }
</style>
</head>
<body>
  <div id="loadScreen">
    <img src="octoorgler_16bit_v8.png" alt="OctoOrgler Loading">
    <div id="loadingText">LOADING OCTOORGLER</div>
    <div id="progressBar"><div id="progressFill"></div></div>
  </div>

  <audio id="floppySound" src="assets/floppy_drive.wav" preload="auto"></audio>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const sound = document.getElementById('floppySound');
      const fill = document.getElementById('progressFill');

      // Attempt autoplay; browsers may block until user interaction
      const playPromise = sound.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          document.body.addEventListener('click', () => sound.play(), { once: true });
        });
      }

      requestAnimationFrame(() => { fill.style.width = '100%'; });

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 3400);
    });
  </script>
</body>
</html>

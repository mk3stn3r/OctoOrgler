<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>OctoOrgler — Admin Settings</title>
<style>
  body { font-family:sans-serif; background:#111; color:#eee; padding:20px; }
  h1 { color:#00ff41; }
  section { margin-bottom:24px; background:#1a1a1a; padding:16px; border-radius:8px; }
  label { display:block; margin:8px 0 2px; }
  input, select { padding:6px; border-radius:4px; border:1px solid #444; background:#222; color:#fff; }
  #pendingBanner { background:#553300; padding:10px; border-radius:6px; display:none; margin-bottom:16px; }
</style>
</head>
<body>
  <h1>OctoOrgler — Admin Settings</h1>
  <div id="pendingBanner">Pending changes — will apply at the start of the next round.</div>

  <section id="serverSection">
    <h2>Server</h2>
  </section>

  <section id="deconzSection">
    <h2>deCONZ Gateway</h2>
  </section>

  <section id="gameplaySection">
    <h2>Gameplay</h2>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const serverSection = document.getElementById('serverSection');
    const deconzSection = document.getElementById('deconzSection');
    const gameplaySection = document.getElementById('gameplaySection');
    const pendingBanner = document.getElementById('pendingBanner');

    function makeRow(label, path, value, type = 'text') {
      const wrapper = document.createElement('div');
      const lbl = document.createElement('label');
      lbl.textContent = label;
      const input = document.createElement('input');
      input.type = type;
      input.value = value;
      input.addEventListener('change', () => {
        fetch('/api/settings/field', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path, value: type === 'number' ? parseFloat(input.value) : input.value })
        });
      });
      wrapper.appendChild(lbl);
      wrapper.appendChild(input);
      return wrapper;
    }

    fetch('/api/settings').then(r => r.json()).then(({ live: settings }) => {
      serverSection.appendChild(makeRow('Listening port (requires restart)', ['server','port'], settings.server.port, 'number'));
      serverSection.appendChild(makeRow('Bind host', ['server','host'], settings.server.host, 'text'));
      serverSection.appendChild(makeRow('Round length (ms)', ['server','roundLengthMs'], settings.server.roundLengthMs, 'number'));

      deconzSection.appendChild(makeRow('Gateway host', ['deconz','gatewayHost'], settings.deconz.gatewayHost, 'text'));
      deconzSection.appendChild(makeRow('Gateway port', ['deconz','gatewayPort'], settings.deconz.gatewayPort, 'number'));
      deconzSection.appendChild(makeRow('Reachability timeout (ms)', ['deconz','reachabilityTimeoutMs'], settings.deconz.reachabilityTimeoutMs, 'number'));

      gameplaySection.appendChild(makeRow('Speed multiplier', ['gameplay','speedMultiplier'], settings.gameplay.speedMultiplier, 'number'));
      gameplaySection.appendChild(makeRow('Miss penalty points', ['gameplay','missPenaltyPoints'], settings.gameplay.missPenaltyPoints, 'number'));
      gameplaySection.appendChild(makeRow('Max reassigns per round', ['gameplay','maxReassignsPerRound'], settings.gameplay.maxReassignsPerRound, 'number'));
    });

    socket.on('settingsPending', () => { pendingBanner.style.display = 'block'; });
    socket.on('settingsCommitted', () => { pendingBanner.style.display = 'none'; });
  </script>
<script src="/menu.js" defer></script>
</body>
</html>

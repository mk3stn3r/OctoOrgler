<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OctoOrgler</title>
<style>
  body { margin:0; background:#111; color:#fff; font-family:sans-serif; height:100vh; display:flex; flex-direction:column; }
  #lobby { padding:20px; text-align:center; }
  input, select, button { font-size:1.1em; padding:8px; margin:6px; border-radius:6px; border:1px solid #444; background:#222; color:#fff; }
  button { cursor:pointer; background:#333; }
  #lampArea { flex:1; display:flex; align-items:center; justify-content:center; position:relative; min-height:200px; }
  .led { width:40px; height:40px; border-radius:50%; position:absolute; box-shadow:0 0 20px 5px currentColor; transition: background 0.15s; background:#333; }
  #buzzArea { flex:1; display:flex; flex-direction:column; }
  .knob { flex:1; display:flex; align-items:center; justify-content:center; font-size:2.5em; cursor:pointer; user-select:none; touch-action:manipulation; transition: transform 0.08s, filter 0.15s; color: rgba(0,0,0,0.5); font-weight:bold; }
  .digital-timer { font-family:'Courier New', monospace; font-size:3em; font-weight:bold; letter-spacing:4px; color:#00ff41; background:#0a0a0a; border:4px solid #333; border-radius:6px; padding:8px 20px; text-align:center; width:fit-content; margin:10px auto; text-shadow:0 0 8px #00ff41, 0 0 16px #00ff41; box-shadow: inset 0 0 15px rgba(0,255,65,0.3); }
  .digital-timer.warning { color:#ff3b30; text-shadow:0 0 8px #ff3b30, 0 0 16px #ff3b30; animation: pulse 0.5s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
  .reassign-btn { display:block; margin:6px auto; padding:10px 16px; background:#333; color:#fff; border:2px solid #555; border-radius:6px; font-size:0.9em; cursor:pointer; }
  .reassign-btn:disabled { opacity:0.4; cursor:not-allowed; }
  #scoreDisplay { text-align:center; font-size:1.4em; }
</style>
</head>
<body>
  <div id="lobby">
    <h1>OctoOrgler</h1>
    <div id="joinForm">
      <input id="nameInput" placeholder="Your name" />
      <button id="joinBtn">Join</button>
    </div>
    <div id="modeForm" style="display:none">
      <select id="modeSelect">
        <option value="beginner">Beginner</option>
        <option value="novice" selected>Novice</option>
        <option value="expert">Expert</option>
      </select>
      <button id="startBtn">Start Game</button>
    </div>
    <div id="scoreDisplay"></div>
    <div id="timerDisplay" class="digital-timer" style="display:none">0:30</div>
    <button id="reassignBtn" class="reassign-btn" style="display:none">Can't see my bulb — Reassign</button>
  </div>
  <div id="lampArea"></div>
  <div id="buzzArea"><div class="knob" id="tapBtn">TAP</div></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>

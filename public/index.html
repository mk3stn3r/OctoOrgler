<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>OctoOrgler</title>
<style>
  html, body { margin:0; padding:0; background:#0a0a0a; color:#fff; font-family:sans-serif; height:100%; overflow-x:hidden; }
  #app { max-width:480px; margin:0 auto; padding:16px; box-sizing:border-box; text-align:center; }
  h1 { letter-spacing:2px; }
  #joinForm input { padding:10px; font-size:1em; border-radius:6px; border:none; width:70%; }
  #joinForm button, #modeForm button, #startBtn { padding:10px 18px; margin:6px 4px; border:none; border-radius:6px; font-size:1em; cursor:pointer; background:#333; color:#fff; }
  .digital-timer { font-family:'Courier New', monospace; font-size:3em; font-weight:bold; letter-spacing:4px; color:#00ff41; background:#0a0a0a; border:3px solid #333; border-radius:6px; padding:6px 16px; text-align:center; width:fit-content; margin:12px auto; text-shadow:0 0 8px #00ff41; display:none; }
  .digital-timer.warning { color:#ff3b30; text-shadow:0 0 8px #ff3b30; animation: pulse 0.5s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
  #scoreDisplay { font-size:1.3em; margin:10px 0; }

  #myBulbBoard { position: relative; width: 220px; height: 220px; margin: 10px auto 4px; }
  #myBulbBoard svg { width:100%; height:100%; }
  #myBulbBoard .bulb-highlight { fill: none; stroke: #ffffff; stroke-width: 4; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  #myBulbBoard .bulb-highlight.active { opacity: 1; animation: ringPulse 1.1s infinite; }
  @keyframes ringPulse { 0%, 100% { stroke-width: 4; opacity: 1; } 50% { stroke-width: 7; opacity: 0.6; } }

  #reassignBtn { display:none; margin:6px auto; padding:8px 14px; border-radius:6px; border:none; background:#444; color:#fff; cursor:pointer; }
  #reassignBtn:disabled { opacity:0.4; cursor:default; }

  #tapBtn { width:180px; height:180px; border-radius:50%; border:none; margin:16px auto; display:block; font-size:1.6em; font-weight:bold; color:#fff; background:#333; box-shadow:0 0 30px rgba(255,255,255,0.15); transition: transform 0.1s, background 0.15s, filter 0.15s; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<div id="app">
  <h1>OctoOrgler</h1>

  <form id="joinForm">
    <input id="nameInput" type="text" placeholder="Your name" maxlength="16">
    <button id="joinBtn" type="button">Join</button>
  </form>

  <div id="modeForm" style="display:none;">
    <select id="modeSelect">
      <option value="beginner">Beginner</option>
      <option value="novice" selected>Novice</option>
      <option value="expert">Expert</option>
    </select>
    <button id="startBtn" type="button">Start Game</button>
  </div>

  <div id="timerDisplay" class="digital-timer">0:30</div>
  <div id="scoreDisplay"></div>

  <div id="myBulbBoard"></div>

  <button id="reassignBtn" type="button">Can't see my bulb — Reassign</button>

  <button id="tapBtn">TAP</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="myBulbBoard.js"></script>
<script src="client.js"></script>
</body>
</html>

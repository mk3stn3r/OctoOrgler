<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>OctoOrgler Lamp</title>
<style>
  body { margin:0; background:#111; color:#fff; font-family:sans-serif; height:100vh; display:flex; flex-direction:column; }
  #lampArea { flex:1; display:flex; align-items:center; justify-content:center; position:relative; }
  #lampArea svg { width:80%; max-width:600px; height:auto; }
  #lampArea svg [id^="bulb-"] { transition: fill 0.15s, filter 0.15s; filter: drop-shadow(0 0 0px transparent); }
  .digital-timer { font-family:'Courier New', monospace; font-size:4em; font-weight:bold; letter-spacing:6px; color:#00ff41; background:#0a0a0a; border:4px solid #333; border-radius:6px; padding:10px 24px; text-align:center; width:fit-content; margin:10px auto; text-shadow:0 0 8px #00ff41, 0 0 16px #00ff41; }
  .digital-timer.warning { color:#ff3b30; text-shadow:0 0 8px #ff3b30; animation: pulse 0.5s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
</style>
</head>
<body>
  <div id="timerDisplay" class="digital-timer">0:30</div>
  <div id="lampArea"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="lampBoard.js"></script>
  <script src="client.js"></script>
</body>
</html>
